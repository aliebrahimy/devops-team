---
- name: Parse Survey vars and build dynamic inventory
  hosts: localhost
  gather_facts: false
  vars:
    # مسیرهای نصب آفلاین روی سرورها
    rke2_artifact_dest: "/root/rke2-artifacts"
    rke2_config_dir: "/etc/rancher/rke2"
    rke2_images_dir: "/var/lib/rancher/rke2/agent/images"

    # پورت‌های ارتباطی طبق داکیومنت
    rke2_api_port: 6443
    rke2_register_port: 9345

    # تنظیمات پیش‌فرض شبکه کلاستر (بر اساس سند)
    cluster_cidr: "10.42.0.0/16"
    service_cidr: "10.43.0.0/16"
  tasks:
    - name: Add First Master Node
      ansible.builtin.add_host:
        name: "{{ first_master_ip.strip() }}"
        groups: first_master
        ansible_user: root

    - name: Add Additional Master Nodes
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: additional_masters
        ansible_user: root
      loop: "{{ additional_masters_ips.split(',') }}"
      when: additional_masters_ips is defined and additional_masters_ips | trim | length > 0

    - name: Add Worker Nodes
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: workers
        ansible_user: root
      loop: "{{ worker_ips.split(',') }}"
      when: worker_ips is defined and worker_ips | trim | length > 0

    - name: Add Load Balancers (if enabled)
      ansible.builtin.add_host:
        name: "{{ item.strip() }}"
        groups: load_balancers
        ansible_user: root
      loop:
        - "{{ lb1_ip.strip() }}"
        - "{{ lb2_ip.strip() }}"
      when: enable_load_balancer | default(false) | bool

# گام ۲: اجرای پیش‌نیازها و انتقال آرتیفکت‌های آفلاین به تمام نودهای کلاستر
- name: Prepare Offline Artifacts on Kubernetes Nodes
  hosts: first_master:additional_masters:workers
  become: true
  gather_facts: true
  roles:
    - role: common

# گام ۳: راه‌اندازی لودبالانسرها (Nginx + Keepalived) در صورت فعال بودن
- name: Configure Load Balancers
  hosts: load_balancers
  become: true
  gather_facts: true
  roles:
    - role: lb_keepalived
    - role: lb_nginx
  when: hostvars['localhost']['enable_load_balancer'] | default(false) | bool

# گام ۴: راه‌اندازی اولین مستر (Bootstrap Node)
- name: Initialize First Master Node
  hosts: first_master
  become: true
  gather_facts: true
  roles:
    - role: rke2_first_master

# گام ۵: الحاق سایر مسترها به کلاستر
- name: Join Additional Master Nodes
  hosts: additional_masters
  become: true
  gather_facts: true
  roles:
    - role: rke2_join_master
  when: groups['additional_masters'] is defined and groups['additional_masters'] | length > 0

# گام ۶: الحاق نودهای ورکر به کلاستر
- name: Join Worker Nodes
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - role: rke2_agent
  when: groups['workers'] is defined and groups['workers'] | length > 0      