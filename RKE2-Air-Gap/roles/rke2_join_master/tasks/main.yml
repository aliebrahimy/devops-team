---
- name: Determine Server URL for Join
  ansible.builtin.set_fact:
    rke2_server_url: "{{ 'https://' + hostvars['localhost']['lb_vip'] + ':9345' if hostvars['localhost']['enable_load_balancer'] | default(false) | bool else 'https://' + hostvars['localhost']['first_master_ip'] + ':9345' }}"

- name: Create RKE2 config.yaml for additional masters
  ansible.builtin.copy:
    dest: "{{ rke2_config_dir }}/config.yaml"
    content: |
      server: "{{ rke2_server_url }}"
      token: "{{ hostvars[groups['first_master'][0]]['rke2_shared_token'] }}"
      write-kubeconfig-mode: "0644"
      cni: "{{ hostvars['localhost']['cni_type'] }}"
      {% if hostvars['localhost']['cni_type'] == 'cilium' %}
      disable:
        - rke2-canal
        - rke2-kube-proxy
      disable-kube-proxy: true
      {% endif %}
      node-ip: "{{ ansible_default_ipv4.address }}"
      node-name: "{{ inventory_hostname }}"
    mode: '0600'

- name: Install RKE2 server binary offline on replica masters
  ansible.builtin.shell:
    cmd: INSTALL_RKE2_ARTIFACT_PATH={{ rke2_artifact_dest }} sh {{ rke2_artifact_dest }}/install.sh
  environment:
    INSTALL_RKE2_TYPE: "server"

- name: Start and Enable RKE2 server service on replica masters
  ansible.builtin.systemd:
    name: rke2-server
    state: started
    enabled: true
